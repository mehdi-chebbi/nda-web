<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCF Project Cycle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1419;
            color: #fff;
            overflow-x: hidden;
        }

        /* Animated gradient background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #059669 0%, #10b981 25%, #34d399 50%, #fbbf24 75%, #f59e0b 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            opacity: 0.18;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        #viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            overflow: hidden;
        }

        #canvas-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 0 40px rgba(16, 185, 129, 0.3));
        }

        #intro-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.8s ease;
            z-index: 30;
        }

        #intro-text h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            background: linear-gradient(135deg, #059669 0%, #10b981 50%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        #intro-text p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #info-panel {
            position: absolute;
            top: 0;
            right: -50vw;
            width: 50%;
            height: 100%;
            background: rgba(15, 20, 25, 0.75);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-left: 1px solid rgba(16, 185, 129, 0.2);
            transition: right 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 20;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #info-panel.visible {
            right: 0;
        }

        #info-panel::-webkit-scrollbar {
            width: 8px;
        }
        #info-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        #info-panel::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #059669, #10b981);
            border-radius: 4px;
        }

        .stage-section {
            min-height: 100vh;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .stage-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, transparent, var(--accent-color), transparent);
            opacity: 0.5;
        }

        .section-badge {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(52, 211, 153, 0.3));
            border: 1px solid rgba(16, 185, 129, 0.4);
            backdrop-filter: blur(10px);
        }

        .stage-number {
            font-size: 8rem;
            line-height: 1;
            margin-bottom: 1rem;
            font-weight: 900;
            background: linear-gradient(135deg, #10b981 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0.35;
            font-variant-numeric: tabular-nums;
        }

        .stage-title {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 30px rgba(16, 185, 129, 0.4);
        }

        .stage-desc {
            font-size: 1.05rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            max-width: 90%;
        }

        .stage-desc strong {
            color: rgba(255, 255, 255, 1);
            display: block;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            font-size: 1em;
        }
        .stage-desc ul {
            margin: 1rem 0 1rem 2rem;
            color: rgba(255, 255, 255, 0.85);
        }
        .stage-desc li {
            margin-bottom: 0.75rem;
        }

        #scroll-spacer {
            height: 200vh;
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        /* Progress bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #059669 0%, #10b981 50%, #fbbf24 100%);
            z-index: 1000;
            transform-origin: left;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        @media (max-width: 768px) {
            #info-panel { 
                width: 100%; 
                right: -100%; 
                top: auto; 
                height: 60vh; 
                bottom: -60vh; 
            }
            #info-panel.visible { right: 0; bottom: 0; }
            #canvas-wrapper.zoomed { transform: translateY(-20%) scale(1) !important; }
            .stage-section { padding: 2rem; }
            .stage-title { font-size: 1.8rem; }
            .stage-number { font-size: 5rem; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="progress-bar" id="progressBar"></div>

    <div id="viewport">
        <div id="canvas-wrapper">
            <canvas id="orbitCanvas"></canvas>

            <div id="intro-text">
                <h1>PROJECT CYCLE</h1>
                <p>Scroll to Explore</p>
            </div>
        </div>

        <div id="info-panel">
            <!-- Content dynamically generated -->
        </div>
    </div>

    <div id="scroll-spacer"></div>

    <script>
    window.history.scrollRestoration = 'manual';

    const sectionConfig = [
        {
            id: 1,
            title: "Strategy, origination and structuring",
            colorTitle: "#10b981",
            accentColor: "#10b981",
            stages: [
                { 
                    id: 1, 
                    title: "Country engagement", 
                    color: "#6ee7b7", 
                    desc: `<strong>Actors:</strong> NDAs, AEs, GCF Secretariat<br><br>Stage 1 is the beginning of all GCF projects. It requires country engagement to ensure that all projects and programmes are aligned with the climate objectives of developing countries and with our strategic plan. This work is supported by the Readiness and Preparatory Support Programme, which provides multi-annual grants to build the capacity of developing countries, and to support the development of country investment platforms which can be financed by GCF and other financial actors.<br><br>During this stage, a country's government and National Designated Authorities (NDAs) or focal points set national priorities, analyse financial needs and gaps, and identify Accredited Entities (AEs) or partners to design and implement funding proposals and projects. This stage also requires that NDAs engage various stakeholders when developing their country priorities to ensure that environmental and social safeguards are in force.<br><br>Country missions and regional structured dialogues are facilitated by the Secretariat to identify country programming priorities and ensure alignment with GCF's investment criteria and the expertise and capabilities of AEs. GCF also supports NDAs/focal points and direct access entities (DAEs) through the Readiness and Preparatory Support Programme to transform project ideas into concrete Concept Notes and Funding Proposals.<br><br>The GCF Secretariat works closely with NDAs and AEs to identify highly impactful project ideas that have the potential to meet all six GCF investment criteria. GCF's early engagement contributes to increasing the "quality at entry" of funding proposals and streamlining the funding proposal approval process.` 
                },
                { 
                    id: 2, 
                    title: "Targeted project generation", 
                    color: "#34d399", 
                    desc: `<strong>Actors:</strong> NDAs, AEs, GCF Secretariat<br><br>Stage 2 supports complementary origination channels for project ideas to be developed by National Designated Authorities (NDAs) and Accredited Entities (AEs). This stage fosters additional funding proposals that meet the criteria of the GCF investment framework through two activities:<br><br><strong>Issuance of targeted requests for proposal (RFPs)</strong><br>The Board approves the terms of reference for each RFP, which usually sets aside a dedicated funding envelope and describes the eligibility and project selection criteria and the project approval processes. After Board approval, the Secretariat publishes the RFP on the GCF website and other communication channels. The Secretariat then invites organizations to submit a funding proposal under a specific RFP.<br><br><strong>Generation of bankable project ideas through dedicated platforms and innovative partnerships</strong><br>GCF cooperates as a partner with project preparation platforms to de-risk and demonstrate the scaling-up potential of climate investments. This provides longer-term visibility and certainty for projects that are otherwise considered as "non-bankable" by investors and financiers.<br><br>As project ideas materialize which align with country priorities, they are then submitted to GCF by the AEs through the regular proposal approval process.` 
                },
                { 
                    id: 3, 
                    title: "Concept note submission", 
                    color: "#10b981", 
                    desc: `<strong>Actors:</strong> NDAs, AEs, GCF Secretariat<br><br>Stage 3 outlines the development, submission, and screening of concept notes (CNs). CNs present a summary of a proposed project/programme and offer an opportunity for the Secretariat to review and provide feedback on initial project/programme concepts.<br><br>Though voluntary*, it is highly encouraged for Accredited Entities (AEs) and National Designated Authorities (NDAs) to submit CNs to reduce review time and lower the transaction costs for all stakeholders. CNs can also lead to higher "quality at entry" for funding proposals.<br><br>The development of CNs should be done in close coordination between AEs and NDAs/focal points to ensure that the proposed activities align with country priorities. The AE will represent the NDA to the GCF Secretariat when submitting a CN. In turn, the Secretariat will notify the NDA/focal point that a CN has been submitted.<br><br>All CNs and related documents submitted to the Secretariat are available on the GCF website.<br><br>The Secretariat is committed to complete our reviews of Concept Notes (stage 3) and Funding Proposals (stage 5) in nine months or less.` 
                }
            ]
        },
        {
            id: 2,
            title: "Technical review and appraisal",
            colorTitle: "#059669",
            accentColor: "#059669",
            stages: [
                { 
                    id: 4, 
                    title: "Funding proposal development", 
                    color: "#84cc16", 
                    desc: `<strong>Actor:</strong> AEs<br><br>Stage 4 covers the development and submission of funding proposals (FPs) by Accredited Entities (AEs). FPs must be prepared in accordance with the considerations and requirements of the investment framework and results management framework. AEs are expected to demonstrate how they will deliver their proposed project activities and results areas with reference to these policy frameworks.<br><br>AEs are responsible for the first-level due diligence of FPs. Project/programme appraisal by the AE involves an in-depth evaluation of the proposed activities and interventions to meet the GCF investment criteria and achieve the desired climate mitigation and/or adaptation results.` 
                },
                { 
                    id: 5, 
                    title: "Funding proposal appraisal", 
                    color: "#65a30d", 
                    desc: `<strong>Actors:</strong> GCF Secretariat + iTAP<br><br>Stage 5 of a GCF project/programme refers to its review process.<br><br>The Secretariat's appraisal is a formal assessment process that ends when FPs that are aligned with the investment criteria are submitted to the independent technical advisory panel (independent TAP) and the Board for approval.<br><br>The Secretariat is committed to complete our reviews of Concept Notes (stage 3) and Funding Proposals (stage 5) in nine months or less.` 
                }
            ]
        },
        {
            id: 3,
            title: "Approval and legal arrangements",
            colorTitle: "#fbbf24",
            accentColor: "#fbbf24",
            stages: [
                { 
                    id: 6, 
                    title: "Board approval", 
                    color: "#fde047", 
                    desc: `<strong>Actor:</strong> GCF Board<br><br>Stage 6 illustrates how the GCF Board considers and decides which FPs will materialize into projects.<br><br>Following the submission of the FP packages to the Board at least 21 days before each Board meeting, the Board members can ask questions or seek clarifications about the FPs through a dedicated question and answer platform/email account.` 
                },
                { 
                    id: 7, 
                    title: "Legal arrangements", 
                    color: "#fbbf24", 
                    desc: `<strong>Actors:</strong> AEs, GCF Secretariat<br><br>Stage 7 consists of the Funded Activity Agreement (FAA) negotiation and signing process following FP approval by the GCF Board. For each approved FP, the GCF and the relevant AE enter into an FAA.<br><br>Following FP approval, the Secretariat prepares the first draft of the FAA and sends it to the AE to start the negotiation process.` 
                }
            ]
        },
        {
            id: 4,
            title: "Implementation",
            colorTitle: "#f59e0b",
            accentColor: "#f59e0b",
            stages: [
                { 
                    id: 8, 
                    title: "Monitoring for performance", 
                    color: "#fbbf24", 
                    desc: `<strong>Actors:</strong> AEs, GCF Secretariat<br><br>Stage 8 describes the GCF Secretariat's monitoring framework and approach. The result management framework provides clear definitions and measurement methodologies for GCF's priority indicators and monitoring and assessment processes.` 
                },
                { 
                    id: 9, 
                    title: "Adaptive management", 
                    color: "#f59e0b", 
                    desc: `<strong>Actors:</strong> AEs, GCF Secretariat<br><br>Stage 9 details the triggers for adaptive management of GCF projects/programmes and response measures in place.<br><br>The three main triggers for adaptive management are:<br><ul><li>Risk flags arising from GCF monitoring tools (mentioned in Stage 8);</li><li>Proactive AE reporting and engagement due to implementation issues; and</li><li>Complaints relating to integrity and violation of environmental and social safeguards.</li></ul>` 
                },
                { 
                    id: 10, 
                    title: "Evaluation and closure", 
                    color: "#d97706", 
                    desc: `<strong>Actors:</strong> AEs, GCF Secretariat<br><br>Stage 10 pertains to how lessons learned are evaluated and synthesised towards project closure. There are two levels of evaluations within GCF: Project/programme level evaluations and GCF level evaluations.` 
                }
            ]
        }
    ];

    const allStages = sectionConfig.flatMap(section => section.stages);

    const canvas = document.getElementById('orbitCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');
    const infoPanel = document.getElementById('info-panel');
    const scrollSpacer = document.getElementById('scroll-spacer');
    const introText = document.getElementById('intro-text');
    const progressBar = document.getElementById('progressBar');

    let isZoomed = false;
    let logicProgress = 0;
    let centerX, centerY, radius;
    let pixelRatio = window.devicePixelRatio || 1;

    // Generate particles
    for (let i = 0; i < 40; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        const duration = 5 + Math.random() * 15;
        const delay = Math.random() * 5;
        particle.style.animation = `float-${i} ${duration}s ease-in-out infinite ${delay}s`;
        
        const keyframes = `
            @keyframes float-${i} {
                0%, 100% { transform: translate(0, 0); opacity: 0.2; }
                25% { transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px); opacity: 0.5; }
                50% { transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px); opacity: 0.8; }
                75% { transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px); opacity: 0.4; }
            }
        `;
        const style = document.createElement('style');
        style.textContent = keyframes;
        document.head.appendChild(style);
        
        document.body.appendChild(particle);
    }

    function buildInfoPanel() {
        infoPanel.innerHTML = '';
        
        allStages.forEach((stage, index) => {
            const section = sectionConfig.find(s => s.stages.includes(stage));
            
            const stageDiv = document.createElement('div');
            stageDiv.className = 'stage-section';
            stageDiv.dataset.stageIndex = index;
            stageDiv.style.setProperty('--accent-color', section.accentColor);
            
            stageDiv.innerHTML = `
                <div class="section-badge">${section.title}</div>
                <div class="stage-number">${(index + 1).toString().padStart(2, '0')}</div>
                <h2 class="stage-title">${stage.title}</h2>
                <div class="stage-desc">${stage.desc}</div>
            `;
            
            infoPanel.appendChild(stageDiv);
        });
    }

    function resetToStart() {
        window.scrollTo(0, 0);
        isZoomed = false;
        logicProgress = 0;
        introText.style.opacity = '1';
        infoPanel.classList.remove('visible');
        wrapper.classList.remove('zoomed');
        wrapper.style.transform = "translateX(0) scale(1)";
        if (infoPanel.children.length > 0) {
            infoPanel.scrollTop = 0;
        }
        resize();
    }

    document.addEventListener('DOMContentLoaded', () => {
        buildInfoPanel();
        resetToStart();
    });

    window.addEventListener('load', () => {
        resetToStart();
        draw(); 
    });

    function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        canvas.width = width * pixelRatio;
        canvas.height = height * pixelRatio;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        
        ctx.scale(pixelRatio, pixelRatio);
        
        centerX = width / 2;
        centerY = height / 2;
        radius = Math.min(width, height) * 0.35;
        draw();
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        const lines = [];

        for(let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = context.measureText(testLine);
            const testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                lines.push(line);
                line = words[n] + ' ';
            } else {
                line = testLine;
            }
        }
        lines.push(line);

        const totalHeight = lines.length * lineHeight;
        let startY = y - (totalHeight / 2) + (lineHeight / 2);

        for(let k = 0; k < lines.length; k++) {
            context.fillText(lines[k], x, startY + (k * lineHeight));
        }
    }

    function draw() {
        const width = canvas.width / pixelRatio;
        const height = canvas.height / pixelRatio;

        ctx.clearRect(0, 0, width, height);

        const totalSteps = 10;
        const anglePerStage = (Math.PI * 2) / totalSteps;
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + (logicProgress * anglePerStage);

        const stageIndex = Math.floor(Math.min(Math.max(0, logicProgress), 9));
        let sectionIndex = 0;
        let count = 0;
        for(let i = 0; i < sectionConfig.length; i++) {
            count += sectionConfig[i].stages.length;
            if (stageIndex < count) {
                sectionIndex = i;
                break;
            }
        }
        
        if (sectionIndex >= sectionConfig.length) sectionIndex = sectionConfig.length - 1;

        // Glowing background ring
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.15)';
        ctx.lineWidth = 16;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Inner glow
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius - 8, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.05)';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Active gradient path
        if (logicProgress > 0.05) {
            const gradient = ctx.createLinearGradient(
                centerX - radius, centerY,
                centerX + radius, centerY
            );
            gradient.addColorStop(0, '#059669');
            gradient.addColorStop(0.5, '#10b981');
            gradient.addColorStop(1, '#fbbf24');

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, endAngle, false);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 16;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(16, 185, 129, 0.6)';
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // Draw nodes
        for (let i = 0; i < totalSteps; i++) {
            const angle = startAngle + (i * anglePerStage);
            const x = centerX + Math.cos(angle) * radius;
            const y = centerY + Math.sin(angle) * radius;
            const stageColor = allStages[i].color;

            const isReached = i < logicProgress;
            const isCurrentHead = (logicProgress >= i && logicProgress < i + 1);

            let r = 28;
            let fillColor = 'rgba(20, 20, 30, 0.9)';
            let textColor = 'rgba(255, 255, 255, 0.4)';
            let glowColor = 'transparent';

            if (isZoomed) {
                if (isReached) {
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
                    gradient.addColorStop(0, stageColor);
                    gradient.addColorStop(1, stageColor + 'cc');
                    fillColor = gradient;
                    textColor = '#0a0a0f';
                    glowColor = stageColor;
                } else if (isCurrentHead) {
                    fillColor = 'rgba(255, 255, 255, 0.95)';
                    textColor = '#10b981';
                    glowColor = '#10b981';
                    r = 32;
                }
            }

            // Outer glow
            if (glowColor !== 'transparent') {
                ctx.beginPath();
                ctx.arc(x, y, r + 4, 0, Math.PI * 2);
                ctx.fillStyle = glowColor + '40';
                ctx.filter = 'blur(8px)';
                ctx.fill();
                ctx.filter = 'none';
            }

            // Node circle
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = fillColor;
            ctx.fill();
            
            // Border
            ctx.lineWidth = 2;
            ctx.strokeStyle = isReached || isCurrentHead ? 'rgba(255, 255, 255, 0.3)' : 'rgba(255, 255, 255, 0.1)';
            ctx.stroke();

            // Number text
            ctx.fillStyle = textColor;
            ctx.font = "bold 18px 'Segoe UI', Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(i + 1, x, y);
        }

        // Center text with gradient
        if (isZoomed && logicProgress > 0.5) {
            const currentStageData = allStages[stageIndex];
            
            const gradient = ctx.createLinearGradient(centerX - radius, centerY, centerX + radius, centerY);
            gradient.addColorStop(0, '#059669');
            gradient.addColorStop(0.5, '#10b981');
            gradient.addColorStop(1, '#fbbf24');
            
            ctx.fillStyle = gradient;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            const fontSize = radius * 0.16;
            ctx.font = `900 ${fontSize}px 'Segoe UI', Arial, sans-serif`;
            
            const maxWidth = radius * 1.6;
            const lineHeight = fontSize * 1.3;

            wrapText(ctx, currentStageData.title.toUpperCase(), centerX, centerY, maxWidth, lineHeight);
        }
    }

    function handleScroll() {
        const scrollY = window.scrollY;
        const threshold = window.innerHeight * 0.2;

        // Update progress bar
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const scrollProgress = Math.min(scrollY / maxScroll, 1);
        progressBar.style.width = (scrollProgress * 100) + '%';

        if (scrollY > threshold && !isZoomed) {
            isZoomed = true;
            introText.style.opacity = '0';
            infoPanel.classList.add('visible');
            wrapper.classList.add('zoomed');

            if (window.innerWidth > 768) {
                wrapper.style.transform = "translateX(-25vw) scale(1)";
            } else {
                wrapper.style.transform = "translateY(-20%) scale(1)";
            }
            
            requestAnimationFrame(() => resize());

        } else if (scrollY <= threshold && isZoomed) {
            isZoomed = false;
            introText.style.opacity = '1';
            infoPanel.classList.remove('visible');
            wrapper.classList.remove('zoomed');
            wrapper.style.transform = "translateX(0) scale(1)";
            
            logicProgress = 0;
            infoPanel.scrollTop = 0;
            requestAnimationFrame(() => resize());
        }
    }

    function handleInfoPanelScroll() {
        if (!isZoomed) return;

        const panelScroll = infoPanel.scrollTop;
        const panelHeight = infoPanel.scrollHeight - infoPanel.clientHeight;
        const scrollProgress = Math.min(1, Math.max(0, panelScroll / panelHeight));
        const newProgress = scrollProgress * 10;

        if (Math.abs(newProgress - logicProgress) > 0.01) {
            logicProgress = newProgress;
            requestAnimationFrame(draw);
        }
    }

    wrapper.addEventListener('transitionend', () => {
        resize();
    });

    window.addEventListener('resize', resize);
    window.addEventListener('scroll', handleScroll);
    infoPanel.addEventListener('scroll', handleInfoPanelScroll);

    resize();

    </script>
</body>
</html>
