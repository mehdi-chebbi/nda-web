<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCF Project Cycle - Unified Scroll</title>
    <style>
        :root {
            /* Colors */
            --bg-color: #f9f9f9;
            --text-primary: #1a1a1a;
            --text-secondary: #444444;

            /* Section Colors */
            --sec1-title: #3B82F6;
            --sec1-s1: #93C5FD;
            --sec1-s2: #60A5FA;
            --sec1-s3: #3B82F6;

            --sec2-title: #10B981;
            --sec2-s4: #6EE7B7;
            --sec2-s5: #34D399;

            --sec3-title: #8B5CF6;
            --sec3-s6: #C4B5FD;
            --sec3-s7: #A78BFA;

            --sec4-title: #F97316;
            --sec4-s8: #FDBA74;
            --sec4-s9: #FB923C;
            --sec4-s10: #F97316;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        #viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            overflow: hidden;
            background: var(--bg-color);
        }

        #canvas-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        canvas {
            display: block;
            image-rendering: -webkit-optimize-contrast; 
        }

        #info-panel {
            position: absolute;
            top: 0;
            right: -50vw;
            width: 50%;
            height: 100%;
            background: #ffffff;
            color: #333;
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(0, 0, 0, 0.1);
            transition: right 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 20;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #info-panel.visible {
            right: 0;
        }

        /* Custom Scrollbar */
        #info-panel::-webkit-scrollbar {
            width: 6px;
        }
        #info-panel::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        #info-panel::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 3px;
        }

        /* Stage sections */
        .stage-section {
            min-height: 100vh;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            background: #333;
        }

        .stage-number {
            font-size: 6rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            font-weight: 700;
            opacity: 0.1;
            color: #000;
            font-variant-numeric: tabular-nums;
        }

        .stage-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.2;
            font-weight: 700;
            color: #111;
        }

        .stage-desc {
            font-size: 1rem;
            line-height: 1.7;
            color: #555;
            max-width: 90%;
        }

        .stage-desc strong {
            color: #000;
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.25rem;
            font-size: 0.9em;
        }
        .stage-desc ul {
            margin: 0.5rem 0 1rem 1.5rem;
            color: #444;
        }
        .stage-desc li {
            margin-bottom: 0.5rem;
        }

        #intro-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.8s ease;
            z-index: 30;
        }

        #scroll-spacer {
            height: 200vh;
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            #info-panel { 
                width: 100%; 
                right: -100%; 
                top: auto; 
                height: 50vh; 
                bottom: -50vh; 
            }
            #info-panel.visible { right: 0; bottom: 0; }
            #canvas-wrapper.zoomed { transform: translateY(-25%) scale(1) !important; }
            .stage-section { padding: 2rem; }
            .stage-title { font-size: 1.4rem; }
            .stage-number { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <div id="viewport">

        <div id="canvas-wrapper">
            <canvas id="orbitCanvas"></canvas>

            <div id="intro-text">
                <h1 style="font-size: 3rem; margin-bottom: 1rem; letter-spacing: 2px; color: #1a1a1a;">PROJECT CYCLE</h1>
                <p style="color: #555; opacity: 0.8;">Scroll to Begin</p>
            </div>
        </div>

        <div id="info-panel">
            <!-- Content dynamically generated -->
        </div>

    </div>

    <div id="scroll-spacer"></div>

    <script>
    window.history.scrollRestoration = 'manual';

    const sectionConfig = [
        {
            id: 1,
            title: "Strategy, origination and structuring",
            colorTitle: "#3B82F6",
            stages: [
                { 
                    id: 1, 
                    title: "Country engagement", 
                    color: "#93C5FD", 
                    desc: `<strong>Stage 1. Country engagement</strong><br><strong>Actors:</strong> NDAs, AEs, GCF Secretariat<br><br>Stage 1 is the beginning of all GCF projects. It requires country engagement to ensure that all projects and programmes are aligned with the climate objectives of developing countries and with our strategic plan. This work is supported by the Readiness and Preparatory Support Programme, which provides multi-annual grants to build the capacity of developing countries, and to support the development of country investment platforms which can be financed by GCF and other financial actors.<br><br>During this stage, a country's government and National Designated Authorities (NDAs) or focal points set national priorities, analyse financial needs and gaps, and identify Accredited Entities (AEs) or partners to design and implement funding proposals and projects. This stage also requires that NDAs engage various stakeholders when developing their country priorities to ensure that environmental and social safeguards are in force.<br><br>Country missions and regional structured dialogues are facilitated by the Secretariat to identify country programming priorities and ensure alignment with GCF's investment criteria and the expertise and capabilities of AEs. GCF also supports NDAs/focal points and direct access entities (DAEs) through the Readiness and Preparatory Support Programme to transform project ideas into concrete Concept Notes and Funding Proposals.<br><br>The GCF Secretariat works closely with NDAs and AEs to identify highly impactful project ideas that have the potential to meet all six GCF investment criteria. GCF's early engagement contributes to increasing the "quality at entry" of funding proposals and streamlining the funding proposal approval process.` 
                },
                { 
                    id: 2, 
                    title: "Targeted project generation", 
                    color: "#60A5FA", 
                    desc: `<strong>Stage 2. Targeted project generation</strong><br><strong>Actors:</strong> NDAs, AEs, GCF Secretariat<br><br>Stage 2 supports complementary origination channels for project ideas to be developed by National Designated Authorities (NDAs) and Accredited Entities (AEs). This stage fosters additional funding proposals that meet the criteria of the GCF investment framework through two activities:<br><br><strong>Issuance of targeted requests for proposal (RFPs)</strong><br>The Board approves the terms of reference for each RFP, which usually sets aside a dedicated funding envelope and describes the eligibility and project selection criteria and the project approval processes. After Board approval, the Secretariat publishes the RFP on the GCF website and other communication channels. The Secretariat then invites organizations to submit a funding proposal under a specific RFP.<br><br><strong>Generation of bankable project ideas through dedicated platforms and innovative partnerships</strong><br>GCF cooperates as a partner with project preparation platforms to de-risk and demonstrate the scaling-up potential of climate investments. This provides longer-term visibility and certainty for projects that are otherwise considered as "non-bankable" by investors and financiers.<br><br>As project ideas materialize which align with country priorities, they are then submitted to GCF by the AEs through the regular proposal approval process.` 
                },
                { 
                    id: 3, 
                    title: "Concept note submission and screening", 
                    color: "#3B82F6", 
                    desc: `<strong>Stage 3. Concept note submission and screening</strong><br><strong>Actors:</strong> NDAs, AEs, GCF Secretariat<br><br>Stage 3 outlines the development, submission, and screening of concept notes (CNs). CNs present a summary of a proposed project/programme and offer an opportunity for the Secretariat to review and provide feedback on initial project/programme concepts.<br><br>Though voluntary*, it is highly encouraged for Accredited Entities (AEs) and National Designated Authorities (NDAs) to submit CNs to reduce review time and lower the transaction costs for all stakeholders. CNs can also lead to higher "quality at entry" for funding proposals.<br><br>The development of CNs should be done in close coordination between AEs and NDAs/focal points to ensure that the proposed activities align with country priorities. The AE will represent the NDA to the GCF Secretariat when submitting a CN. In turn, the Secretariat will notify the NDA/focal point that a CN has been submitted.<br><br>All CNs and related documents submitted to the Secretariat are available on the GCF website.<br><br>The Secretariat is committed to complete our reviews of Concept Notes (stage 3) and Funding Proposals (stage 5) in nine months or less.<br><br>For more information on how to complete a CN, please refer to the Concept Note screening page.<br><br>* Note: For a Project Preparation Facility (PPF) request, the submission of CNs is mandatory.` 
                }
            ]
        },
        {
            id: 2,
            title: "Technical review and appraisal",
            colorTitle: "#10B981",
            stages: [
                { 
                    id: 4, 
                    title: "Funding proposal development", 
                    color: "#6EE7B7", 
                    desc: `<strong>Stage 4. Funding proposal development</strong><br><strong>Actor:</strong> AEs<br><br>Stage 4 covers the development and submission of funding proposals (FPs) by Accredited Entities (AEs). FPs must be prepared in accordance with the considerations and requirements of the investment framework and results management framework. AEs are expected to demonstrate how they will deliver their proposed project activities and results areas with reference to these policy frameworks.<br><br>AEs are responsible for the first-level due diligence of FPs. Project/programme appraisal by the AE involves an in-depth evaluation of the proposed activities and interventions to meet the GCF investment criteria and achieve the desired climate mitigation and/or adaptation results. This helps the AE to determine whether the proposed project/programme offers an effective solution to address the identified problem, and whether it is technically, financially, economically, environmentally and socially sound and cost-effective.<br><br>When preparing FPs, AEs must work within their accreditation scope which defines the allowed financing modalities and project size and identifies the environmental and social safeguards (ESS) risk categories.<br><br>FPs submitted to GCF must be accompanied by no-objection letters (NOL) from respective NDAs/focal points. These NOLs ensure that the proposed funding proposal is consistent with country-driven approaches and national climate strategies and plans, and signal their support.<br><br>FPs must also present the implementation arrangements through Executing Entities (EEs). AEs may act as EEs or may carry out the project/programme with one or more EEs. AEs are responsible for determining, selecting, and engaging EEs based on their due diligence and other assessments required. GCF does not enter a direct contractual relationship with EEs.<br><br>FPs must be submitted through GCF Partner Portal (GPP) platform. Upon receipt of the funding proposal, the Secretariat performs an initial review and completeness check. Furthermore, all activities will be disclosed to GCF stakeholders with regard to GCF's Information Disclosure Policy.<br><br>Note that there won't be submission deadlines ahead of Board meetings. Instead, deadlines will be published related to the dates by which projects need to be ready for key processes that take place shortly before Board meetings which will be highlighted in Stage 5.` 
                },
                { 
                    id: 5, 
                    title: "Funding proposal appraisal", 
                    color: "#34D399", 
                    desc: `<strong>Stage 5. Funding proposal appraisal</strong><br><strong>Actors:</strong> GCF Secretariat + iTAP<br><br>Stage 5 of a GCF project/programme refers to its review process.<br><br>The Secretariat's appraisal is a formal assessment process that ends when FPs that are aligned with the investment criteria are submitted to the independent technical advisory panel (independent TAP) and the Board for approval.<br><br>The Secretariat is committed to complete our reviews of Concept Notes (stage 3) and Funding Proposals (stage 5) in nine months or less.<br><br>Upon completion of the independent TAP assessment, the Secretariat compiles the FP package, shares it with the Board, and publishes it on the GCF website. The AE must provide confirmation of disclosure of the information included in the FP.` 
                }
            ]
        },
        {
            id: 3,
            title: "Approval and legal arrangements",
            colorTitle: "#8B5CF6",
            stages: [
                { 
                    id: 6, 
                    title: "Board approval", 
                    color: "#C4B5FD", 
                    desc: `<strong>Stage 6. Board approval</strong><br><strong>Actor:</strong> GCF Board<br><br>Stage 6 illustrates how the GCF Board considers and decides which FPs will materialize into projects.<br><br>Following the submission of the FP packages to the Board at least 21 days before each Board meeting, the Board members can ask questions or seek clarifications about the FPs through a dedicated question and answer platform/email account. The Board is given one week to read the documents and send questions to the Secretariat, which are then compiled and forwarded to the accredited entities (AEs). The AEs are given one week to provide written responses to these questions, which are compiled and shared with the Board prior to the Board meeting.<br><br>One day prior to the Board meeting, the Co-Chairs of the Board may organize a consultation/information day. AEs may be requested to attend and respond to any questions from the Board advisers or civil society organizations (CSOs) about their FPs.<br><br>FP considerations will be an agenda item in one of the days allotted for the Board meeting. During this agenda item, a representative from each AE is expected to attend the session, together with the relevant Task Manager and the relevant member of the TAP. The AE representative or TAP member is requested to respond to any questions posed by the Board members and active observers.<br><br>After the funding proposal is approved by the Board, the Secretariat will inform the AE and the NDA/focal point of the Board's decision and the next steps in relation to any agreed approval conditions.<br><br>In case of rejection, NDAs may request for reconsideration from the Independent Redress Mechanism (IRM).` 
                },
                { 
                    id: 7, 
                    title: "Legal arrangements", 
                    color: "#A78BFA", 
                    desc: `<strong>Stage 7. Legal arrangements</strong><br><strong>Actors:</strong> AEs, GCF Secretariat<br><br>Stage 7 consists of the Funded Activity Agreement (FAA) negotiation and signing process following FP approval by the GCF Board. For each approved FP, the GCF and the relevant AE enter into an FAA.<br><br><strong>Standard timeline for the funded activity agreement process</strong><br>Following FP approval, the Secretariat prepares the first draft of the FAA and sends it to the AE to start the negotiation process. In some cases, a negotiations may start prior to the FP approval as long as key prerequisites are met, such as, where applicable, an effective Accreditation Master Agreement (AMA), and delivery by the AE of a certificate of internal AE approval. Furthermore, there should not be any outstanding project-specific conditions precedent to FAA execution.<br><br><strong>Revised Approach to Legal Arrangements – transitional arrangements</strong><br>Under the transitional arrangements adopted in decision B.42/13, paragraph (m) in respect of the Revised approach to legal arrangements with accredited entities (Revised Approach) adopted in decision B.42/13, paragraph (e), AEs accredited prior to 31 October 2025 (the effective date of the Revised Approach) who have a signed AMA (or amended and restated AMA) may continue to submit funding proposals under their AMA, which would be incorporated in the relevant FAA, provided that (i) the AMA or amended and restated AMA becomes effective and the related FAA is signed before 31 December 2027, which FAA will incorporate the relevant AMA; or (ii) the FAA is signed under the Revised Approach and will incorporate the Standard Conditions (or, where applicable, the relevant framework agreement).<br><br><strong>Revised Approach</strong><br>Under the Revised Approach, the FAA will incorporate the Standard Conditions in effect on the date the related FP was approved and will include any project-specific modifications to the Standard Conditions.<br>In those limited circumstances where GCF and the AE have entered into a framework agreement codifying the Standard Conditions in respect of such AE, the FAA will incorporate the applicable framework agreement.<br><br>FAAs are tailored by the Secretariat to each financial instrument offered by the GCF, such as grant, loan, sub-participation, trust arrangement, and also REDD+ RBPs. It is important to have a comprehensive and consistent FP and Term Sheet to make the FAA negotiation process efficient and effective for both the AE and the GCF.<br><br>After negotiations, the FAA must be signed by the parties within a set period determined by the Board in the decision approving the FP.<br><br>The FAA contains or incorporates a set of conditions to be fulfilled by the AE before the FAA becomes legally effective. Once all conditions for effectiveness have been fulfilled, the Secretariat sends to the AE a Notice of Effectiveness for the FAA.<br><br>Lastly, the FAA also contains or incorporates conditions to be met by the AE before the GCF makes the first disbursement for the implementation of the project. Following fulfillment of these conditions, the disbursement is made by the Fund (by the GCF Trustee) to the bank account opened by the AE.` 
                }
            ]
        },
        {
            id: 4,
            title: "Implementation",
            colorTitle: "#F97316",
            stages: [
                { 
                    id: 8, 
                    title: "Monitoring for performance and compliance", 
                    color: "#FDBA74", 
                    desc: `<strong>Stage 8. Monitoring for performance and compliance</strong><br><strong>Actors:</strong> AEs, GCF Secretariat<br><br>Stage 8 describes the GCF Secretariat's monitoring framework and approach. The result management framework provides clear definitions and measurement methodologies for GCF's priority indicators and monitoring and assessment processes.<br><br>In line with the monitoring and accountability framework as updated by decision B.42/13 (MAF), the Secretariat's monitoring function focuses on two components:<br><br><strong>Accredited Entity compliance</strong><br>Self-certification statement on changes potentially affecting compliance with applicable GCF standards and policies. Each AE shall promptly report any changes to its policies, capacities, systems, legal status, or governance structures that may affect its compliance with the GCF standards and policies against which it was assessed – either during the accreditation process or during the funding proposal assessment. These statements may be triggered by changes initiated by an AE as part of its institutional development, such as responses to national regulatory changes, or by updates in GCF standards and policies.<br><br>Self-assessment report on compliance with applicable GCF standards and policies. A self-assessment report on the AE's compliance with the applicable GCF standards and policies must be submitted by the AE to GCF prior to the AE submitting any concept note or funding proposal to the Secretariat, if more than two years and six months have passed since the AE's accreditation decision or its most recent self-assessment, whichever is later. For AEs that have not submitted any concept notes or funding proposals during the relevant period, a self-assessment report shall be required five years after the AE's accreditation decision or its most recent self-assessment, whichever is later.<br><br><strong>Funded activity monitoring</strong><br>AEs have the responsibility of monitoring their respective funded activities. The Secretariat then tracks the implementation progress through the AEs' annual performance reports (APRs), financial statements, rates of disbursement and reporting with reference to specific conditions set out in the legal arrangements between GCF and the AE, and interim evaluation reports.<br><br>If the findings from the risk assessments raise concern, the Secretariat may discuss the results of the monitoring with the AE, which may lead to Stage 9 (adaptive management).<br><br>In accordance with the transitional arrangements adopted in decision B.42/13, paragraph (m) in respect of the updated MAF adopted in decision B.42/13, paragraph (c):<br>Funded activity monitoring with respect to implementation of funding proposals approved at or before B.44 will be in accordance with section1.2 of the monitoring and accountability framework adopted in decision B.11/10, paragraph (a) and the legal arrangements in respect of such funded activity; and<br>Funded activity monitoring with respect to implementation of funding proposals approved at or after B.45 will be in accordance with section 13 of the updated MAF.` 
                },
                { 
                    id: 9, 
                    title: "Adaptive management", 
                    color: "#FB923C", 
                    desc: `<strong>Stage 9. Adaptive management</strong><br><strong>Actors:</strong> AEs, GCF Secretariat<br><br>Stage 9 details the triggers for adaptive management of GCF projects/programmes and response measures in place.<br><br>The three main triggers for adaptive management are:<br><ul><li>Risk flags arising from GCF monitoring tools (mentioned in Stage 8);</li><li>Proactive AE reporting and engagement due to implementation issues; and</li><li>Complaints relating to integrity and violation of environmental and social safeguards.</li></ul>Once risks are identified, the AE and/or the project/programme will be subjected to a "cure period" to resolve issues and avoid recurrence. If the identified issues remain unresolved by the end of the "cure period," the Secretariat will inform the AE of any additional measures required. The timing and nature of such measures depends on the potential impacts and risks identified, including the reputational risk to GCF. Failure to resolve may result in cancelation of AE accreditation and revoking of FP approval.<br><br>Should modifications be made during this process, the AE is required to inform the GCF. If the proposed change falls within the definition of a Major Change, the Secretariat will request a restructuring paper, a written evidence of the AE's consultation with the relevant NDA/FP, and supporting documentations.<br><br>If the Board approves the Major Change, the FAA will be amended. If not, the AE will either (a) proceed based on the existing Board-approved FP; or (b) withdraw the FP, after informing the NDA/Focal Point.` 
                },
                { 
                    id: 10, 
                    title: "Evaluation, learning and project closure", 
                    color: "#F97316", 
                    desc: `<strong>Stage 10. Evaluation, learning and project closure</strong><br><strong>Actors:</strong> AEs, GCF Secretariat<br><br>Stage 10 pertains to how lessons learned are evaluated and synthesised towards project closure. There are two levels of evaluations within GCF:<br><br><strong>Project/programme level evaluations</strong><br>It is the obligation of AEs to manage and submit independent final evaluations for approved GCF projects and programmes. These evaluations are expected to produce evidence of results and impacts relative to projections, informing future decision-making, credibility approaches, and investment processes. These will also serve as a reference for when projects are needed to be upscaled or replicated. GCF's results management framework sets indicators and monitoring and assessment processes, ensuring that GCF projects/programmes apply the same approach and generate consistent data that can be aggregated and compared across the entire GCF portfolio.<br><br><strong>GCF level evaluations</strong><br>The Independent Evaluation Unit (IEU) of GCF conducts reviews to help improve the institutional and financial efficiency and effectiveness of GCF for future replenishments.<br><br>Together with AEs, national designated authorities/focal points, peer climate funds, and relevant stakeholders, the Secretariat synthesises and codifies lessons learned to promote the expansion and replication of knowledge on transformative climate investments based on global best practices.<br><br>Additionally, in order to ensure timely knowledge management from GCF operations, GCF conducts knowledge-gathering missions and reviews to select project sites, fostering a deeper understanding of operating realities and impact stories.<br><br>The Secretariat also conducts higher-level reviews such as thematic and country portfolio reviews. This plays a key role in assessing GCF effectiveness in the global climate action. These reviews by the Secretariat can be complemented by the IEU's evaluations.<br><br>In the project closure phase, the AE should confirm that the project activities were executed and completed. This will also entail the submission of a project completion and audit reports and execution of the exit strategy as outlined in the FAA.<br><br>Once the documentations are analysed and validated, the Secretariat will confirm the closure of the project and notify the AE and NDA.<br><br>Complaints can still be submitted to the IRM even after project closure.` 
                }
            ]
        }
    ];

    const allStages = sectionConfig.flatMap(section => section.stages);

    const canvas = document.getElementById('orbitCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');
    const infoPanel = document.getElementById('info-panel');
    const scrollSpacer = document.getElementById('scroll-spacer');
    const introText = document.getElementById('intro-text');

    let isZoomed = false;
    let logicProgress = 0;
    let centerX, centerY, radius;
    let pixelRatio = window.devicePixelRatio || 1;

    // Build info panel content
    function buildInfoPanel() {
        infoPanel.innerHTML = '';
        
        allStages.forEach((stage, index) => {
            const section = sectionConfig.find(s => s.stages.includes(stage));
            
            const stageDiv = document.createElement('div');
            stageDiv.className = 'stage-section';
            stageDiv.dataset.stageIndex = index;
            
            stageDiv.innerHTML = `
                <div class="section-badge" style="background-color: ${section.colorTitle}">${section.title}</div>
                <div class="stage-number">${(index + 1).toString().padStart(2, '0')}</div>
                <h2 class="stage-title">${stage.title}</h2>
                <div class="stage-desc">${stage.desc}</div>
            `;
            
            infoPanel.appendChild(stageDiv);
        });
    }

    function resetToStart() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;

        isZoomed = false;
        logicProgress = 0;

        introText.style.opacity = '1';
        infoPanel.classList.remove('visible');
        wrapper.classList.remove('zoomed');
        wrapper.style.transform = "translateX(0) scale(1)";
        
        if (infoPanel.children.length > 0) {
            infoPanel.scrollTop = 0;
        }

        resize();
    }

    document.addEventListener('DOMContentLoaded', () => {
        buildInfoPanel();
        resetToStart();
    });

    window.addEventListener('load', () => {
        resetToStart();
        draw(); 
    });

    function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        canvas.width = width * pixelRatio;
        canvas.height = height * pixelRatio;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        
        ctx.scale(pixelRatio, pixelRatio);
        
        centerX = width / 2;
        centerY = height / 2;

        if (isZoomed) {
            radius = Math.min(width * 0.5, height) * 0.4;
        } else {
            radius = Math.min(width, height) * 0.35;
        }
        draw();
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        const lines = [];

        for(let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = context.measureText(testLine);
            const testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                lines.push(line);
                line = words[n] + ' ';
            } else {
                line = testLine;
            }
        }
        lines.push(line);

        const totalHeight = lines.length * lineHeight;
        let startY = y - (totalHeight / 2) + (lineHeight / 2);

        for(let k = 0; k < lines.length; k++) {
            context.fillText(lines[k], x, startY + (k * lineHeight));
        }
    }

    function draw() {
        const width = canvas.width / pixelRatio;
        const height = canvas.height / pixelRatio;

        ctx.clearRect(0, 0, width, height);

        const totalSteps = 10;
        const anglePerStage = (Math.PI * 2) / totalSteps;
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + (logicProgress * anglePerStage);

        const stageIndex = Math.floor(Math.min(Math.max(0, logicProgress), 9));
        let sectionIndex = 0;
        let count = 0;
        for(let i = 0; i < sectionConfig.length; i++) {
            count += sectionConfig[i].stages.length;
            if (stageIndex < count) {
                sectionIndex = i;
                break;
            }
        }
        
        if (sectionIndex >= sectionConfig.length) sectionIndex = sectionConfig.length - 1;

        // Background ring
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.lineWidth = 12; 
        ctx.lineCap = 'butt';
        ctx.stroke();

        // Active path
        if (logicProgress > 0.05) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, endAngle, false);
            ctx.strokeStyle = '#1e293b'; 
            ctx.lineWidth = 12; 
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // Draw nodes
        for (let i = 0; i < totalSteps; i++) {
            const angle = startAngle + (i * anglePerStage);
            const x = centerX + Math.cos(angle) * radius;
            const y = centerY + Math.sin(angle) * radius;
            const stageColor = allStages[i].color;

            ctx.beginPath();
            
            const isReached = i < logicProgress;
            const isCurrentHead = (logicProgress >= i && logicProgress < i + 1);

            let r = 25; 
            let fillColor = '#ffffff';
            let textColor = '#999'; 
            let strokeColor = 'rgba(0,0,0,0.2)';
            let lineWidth = 2;

            if (isZoomed) {
                if (isReached) {
                    fillColor = stageColor;
                    textColor = '#000000';
                    lineWidth = 0;
                } else if (isCurrentHead) {
                    fillColor = '#ffffff';
                    textColor = '#1e293b';
                    lineWidth = 4;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#1e293b';
                } else {
                    fillColor = '#ffffff';
                    strokeColor = 'rgba(0,0,0,0.2)';
                }
            } else {
                fillColor = '#ffffff';
                strokeColor = 'rgba(0,0,0,0.2)';
                textColor = '#999';
            }

            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = fillColor;
            ctx.fill();
            
            if (lineWidth > 0) {
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = strokeColor;
                ctx.stroke();
            }
            
            ctx.shadowBlur = 0; 

            ctx.fillStyle = textColor;
            ctx.font = "bold 16px 'Segoe UI', Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(i + 1, x, y);
        }

        // Center text
        if (isZoomed && logicProgress > 0.5) {
            const currentStageData = allStages[stageIndex];
            
            ctx.fillStyle = sectionConfig[sectionIndex].colorTitle;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            const fontSize = radius * 0.18; 
            ctx.font = `bold ${fontSize}px 'Segoe UI', Arial, sans-serif`;
            
            const maxWidth = radius * 1.5;
            const lineHeight = fontSize * 1.2;

            wrapText(ctx, currentStageData.title.toUpperCase(), centerX, centerY, maxWidth, lineHeight);
        }
    }

    function handleScroll() {
        const scrollY = window.scrollY;
        const threshold = window.innerHeight * 0.2;

        if (scrollY > threshold && !isZoomed) {
            isZoomed = true;
            introText.style.opacity = '0';
            infoPanel.classList.add('visible');
            wrapper.classList.add('zoomed');

            if (window.innerWidth > 768) {
                wrapper.style.transform = "translateX(-25vw) scale(1.1)";
            } else {
                wrapper.style.transform = "translateY(-25%) scale(1)";
            }
            
            requestAnimationFrame(() => resize());

        } else if (scrollY <= threshold && isZoomed) {
            isZoomed = false;
            introText.style.opacity = '1';
            infoPanel.classList.remove('visible');
            wrapper.classList.remove('zoomed');
            wrapper.style.transform = "translateX(0) scale(1)";
            
            logicProgress = 0;
            infoPanel.scrollTop = 0;
            requestAnimationFrame(() => resize());
        }
    }

    function handleInfoPanelScroll() {
        if (!isZoomed) return;

        const panelScroll = infoPanel.scrollTop;
        const panelHeight = infoPanel.scrollHeight - infoPanel.clientHeight;

        // Calculate progress based on panel scroll
        const scrollProgress = Math.min(1, Math.max(0, panelScroll / panelHeight));
        const newProgress = scrollProgress * 10;

        if (Math.abs(newProgress - logicProgress) > 0.01) {
            logicProgress = newProgress;
            requestAnimationFrame(draw);
        }
    }

    wrapper.addEventListener('transitionend', () => {
        resize();
    });

    window.addEventListener('resize', resize);
    window.addEventListener('scroll', handleScroll);
    infoPanel.addEventListener('scroll', handleInfoPanelScroll);

    resize();

    </script>
</body>
