<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hobbiton Scroll</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind (for utility classes used in HTML) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #1f1f1f;
      --white: #fff;
      --overlay-opacity: 1;
    }

    body {
      margin: 0;
      background-color: var(--black);
      color: var(--white);
      font-family: "Roboto", sans-serif;
      font-size: 20px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .hero-container {
      position: relative;
    }

    .hero__content {
      height: 100vh;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .hero__bg {
      background-image: url("https://assets.codepen.io/204808/hobbiton.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      filter: blur(3px) brightness(1.5);
      height: 100vh;
      width: 100%;
      will-change: filter, transform;
    }

    .hero__title {
      position: absolute;
      top: 50vh;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      margin: 0;
      padding: 0;
      color: var(--black);
      font-weight: 700;
      font-size: clamp(3.125rem, 17.321vw - 1.357rem, 12.5rem);
      line-height: clamp(4.688rem, 21.363vw - 0.84rem, 16.25rem);
      opacity: 0;
      filter: blur(10px);
      z-index: 100;
      will-change: transform, filter, opacity;
    }

    .hero__cover {
      position: absolute;
      inset: 0;
      height: 100vh;
      width: 100vw;
      perspective: 500px;
      overflow: hidden;
      z-index: 2;
    }

    .hero__cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle,
        rgba(0, 0, 0, 0) 20%,
        rgba(0, 0, 0, 1) 90%
      );
      opacity: var(--overlay-opacity);
      pointer-events: none;
    }

    .hero__cover-img {
      height: 100%;
      width: 100%;
      object-fit: cover;
      pointer-events: none;
      will-change: transform;
    }

    .section-stick {
      position: relative;
    }

    .hobbiton {
      position: relative;
    }

    .hobbiton::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle,
        rgba(0, 0, 0, 0) 40%,
        rgba(0, 0, 0, 0.7) 90%
      );
      pointer-events: none;
    }

    .hobbiton-img {
      height: 100vh;
      width: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

<main>
  <div class="hero-container">
    <section class="hero">
      <div class="hero__content">
        <div class="hero__bg"></div>
        <h1 class="hero__title">Hobbiton</h1>
      </div>

      <div class="hero__cover">
        <img
          class="hero__cover-img"
          src="https://assets.codepen.io/204808/hobbit-hole.png"
          alt=""
        />
      </div>
    </section>
  </div>

  <section class="section-stick min-h-screen bg-black flex justify-center items-center text-white">
    <p class="opacity-reveal text-7xl text-center w-3/5">
      If ever you are passing my way, don't wait to knock! Tea is at four; but any of you are welcome at any time.
    </p>
  </section>

  <section class="hobbiton">
    <img
      class="hobbiton-img"
      src="https://assets.codepen.io/204808/hobitton.jpg"
      alt=""
    />
  </section>
</main>

<!-- GSAP Core -->
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

<!-- GSAP Plugins -->
<script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/ScrollSmoother.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/SplitText.min.js"></script>

<script>
  gsap.registerPlugin(ScrollTrigger, ScrollSmoother, SplitText);

  ScrollSmoother.create({
    smooth: 1,
    effects: true,
    normalizeScroll: true
  });

  gsap.timeline({
    scrollTrigger: {
      trigger: ".hero-container",
      start: "top top",
      end: "+=150%",
      pin: true,
      scrub: 1
    }
  })
  .to(".hero__cover-img", {
    scale: 2,
    z: 350,
    transformOrigin: "center center",
    ease: "power1.inOut"
  })
  .to(".hero__cover", {
    "--overlay-opacity": 0,
    ease: "power1.inOut"
  }, "<")
  .to(".hero__bg", {
    scale: 1.1,
    filter: "blur(0px) brightness(1)",
    ease: "power1.inOut"
  }, "<")
  .to(".hero__title", {
    scale: 1,
    opacity: 1,
    filter: "blur(0px)",
    ease: "power1.inOut"
  }, "<");

  const split = SplitText.create(document.querySelector(".opacity-reveal"));
  gsap.set(split.chars, { opacity: 0.2 });

  gsap.timeline({
    scrollTrigger: {
      trigger: ".section-stick",
      pin: true,
      start: "center center",
      end: "+=1500",
      scrub: 1
    }
  })
  .to(split.chars, {
    opacity: 1,
    stagger: 1,
    ease: "none"
  })
  .to({}, { duration: 10 })
  .to(".opacity-reveal", {
    opacity: 0,
    scale: 1.2,
    duration: 50
  });
</script>

</body>
</html>
