services:
  postgres:
    image: postgres:16-alpine
    container_name: eritrea-readiness-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eritrea_readiness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eritrea-readiness-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eritrea-readiness-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eritrea_readiness
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eritrea-readiness-network

  frontend:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile
    container_name: eritrea-readiness-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - eritrea-readiness-network

volumes:
  postgres_data:
  backend_uploads:
  backend_docs:
  backend_news_imgs:

networks:
  eritrea-readiness-network:
    driver: bridge
